name: CI

on:
  pull_request:
  push:
    branches: [main, master]

defaults:
  run:
    working-directory: kaavu-new

jobs:
  next-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: kaavu-new/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: kaavu-new
          file: kaavu-new/Dockerfile
          push: false
          tags: kaavu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
